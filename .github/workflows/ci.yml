name: CodecLoom CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    name: "回归 · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原
        run: dotnet restore SimdCodecsWorkbench.slnx

      - name: 编译（Release，零警告）
        run: dotnet build SimdCodecsWorkbench.slnx -c Release --no-restore

      - name: xUnit 97 项 + 覆盖率
        run: >
          dotnet test SimdCodecs.Tests/SimdCodecs.Tests.csproj -c Release
          --no-build --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=xunit.trx"

      - name: 桌面端到端自检（--selftest）
        run: dotnet SimdCodecsViewer/bin/Release/net10.0/SimdCodecsViewer.dll --selftest

      - name: GUI 冒烟（Windows）
        if: runner.os == 'Windows'
        run: dotnet SimdCodecsViewer/bin/Release/net10.0/SimdCodecsViewer.dll --smoke

      - name: GUI 冒烟（Linux / Xvfb）
        if: runner.os == 'Linux'
        run: |
          # Avalonia X11 + Skia 需要的运行时库，GitHub runner 不保证齐全
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libxext6 libxi6 libxrandr2 \
            libxcursor1 libice6 libsm6 libfontconfig1 libfreetype6
          xvfb-run -a dotnet SimdCodecsViewer/bin/Release/net10.0/SimdCodecsViewer.dll --smoke

      - name: API 真实 Kestrel 集成（--apitest，含文档端点 CPU 冒烟）
        run: dotnet SimdCodecs.Api/bin/Release/net10.0/SimdCodecs.Api.dll --apitest

      - name: 命令行批量（scan-split 预设，真实 3 页 TIFF）
        shell: bash
        run: |
          dotnet SimdCodecsViewer/bin/Release/net10.0/SimdCodecsViewer.dll --batch testdata ci-out scan-split
          test -f ci-out/multipage-pillow-p001.png
          test -f ci-out/multipage-pillow-p002.png
          test -f ci-out/multipage-pillow-p003.png
          test -f ci-out/_manifest.csv

      - name: 文档智能 CLI（真实 HEIC · CPU tiny · 增强 + OCR + 对比）
        shell: bash
        run: |
          mkdir -p ci-doc-in
          cp testdata/example.heic ci-doc-in/
          dotnet SimdCodecsViewer/bin/Release/net10.0/SimdCodecsViewer.dll --document ci-doc-in ci-doc-out both compare
          test -f ci-doc-out/_document_manifest.csv
          test -f ci-doc-out/example.txt
          test -f ci-doc-out/example-enhanced.png
          grep -q "OK" ci-doc-out/_document_manifest.csv

      - name: 发布 API 与单文件桌面程序
        shell: bash
        run: |
          dotnet publish SimdCodecs.Api/SimdCodecs.Api.csproj -c Release -o ci-publish/api
          dotnet publish SimdCodecsViewer/SimdCodecsViewer.csproj -c Release \
            -r ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} \
            --self-contained false -p:PublishSingleFile=true -o ci-publish/viewer

      - name: 发布产物校验（存在性 / 体积 / 可运行）
        shell: bash
        run: |
          test -f ci-publish/api/SimdCodecs.Api.dll
          test -f ci-publish/api/wwwroot/index.html
          test "$(du -m ci-publish/api/SimdCodecs.Api.dll | cut -f1)" -gt 0
          # 合规声明必须随每个二进制产物分发（Apache-2.0 引擎 + MIT / PaddleOCR 模型权重）
          test -f ci-publish/api/THIRD-PARTY-NOTICES.txt
          test -f ci-publish/api/LICENSES/Apache-2.0.txt
          test -f ci-publish/api/LICENSE
          test -f ci-publish/viewer/THIRD-PARTY-NOTICES.txt
          test -f ci-publish/viewer/LICENSES/Apache-2.0.txt
          dotnet ci-publish/api/SimdCodecs.Api.dll --apitest
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f ci-publish/viewer/SimdCodecsViewer.exe
            ci-publish/viewer/SimdCodecsViewer.exe --selftest
          else
            test -f ci-publish/viewer/SimdCodecsViewer
            chmod +x ci-publish/viewer/SimdCodecsViewer
            ci-publish/viewer/SimdCodecsViewer --selftest
          fi

      - name: 上传测试与覆盖率产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  aot:
    name: "NativeAOT · windows-latest"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # 显式准备 MSVC 环境：本机曾因 Windows SDK 装在非标准盘而找不到 advapi32.lib
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 还原
        run: dotnet restore SimdCodecsViewer/SimdCodecsViewer.csproj
      - name: 发布原生 exe（组合模块，检查裁剪警告）
        shell: pwsh
        run: |
          dotnet publish SimdCodecsViewer/SimdCodecsViewer.csproj -c Release `
            -r win-x64 -p:PublishAot=true -p:StripSymbols=true -o aot-ci 2>&1 |
            Tee-Object -FilePath aot-build.log
          if ($LASTEXITCODE -ne 0) { throw "AOT publish failed with exit code $LASTEXITCODE" }
          $il = Select-String -Path aot-build.log -Pattern "IL2026|IL3050"
          if ($il) { $il; throw "AOT 裁剪警告不为零（增强 + OCR 嵌入模型未完整保留）" }
          Write-Output "AOT 编译完成：IL2026 / IL3050 = 0"

      - name: 组合 NativeAOT 自检（增强 + OCR 全链路）
        shell: pwsh
        run: |
          $log = .\aot-ci\SimdCodecsViewer.exe --selftest 2>&1
          $code = $LASTEXITCODE
          $log | Select-String -Pattern "文档智能模块|自检全部通过"
          if ($code -ne 0) { throw "AOT selftest failed with exit code $code" }
          if (-not ($log -match "增强→OCR 一步式")) { throw "文档模型未随 AOT 产物分发" }
          $sizeMb = (Get-Item .\aot-ci\SimdCodecsViewer.exe).Length / 1MB
          Write-Output ("AOT exe: {0:N1} MB" -f $sizeMb)
          if ($sizeMb -lt 35) { throw "嵌入模型疑似被裁剪" }
      - name: 原生 exe 命令行批量
        run: .\aot-ci\SimdCodecsViewer.exe --batch testdata aot-ci-out scan-split

  # ---- CD：镜像推 GHCR（默认分支或 v* tag，且全部回归通过）----
  docker:
    name: "镜像 · GHCR"
    runs-on: ubuntu-latest
    needs: [test, aot]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 镜像名小写化（GHCR 不接受大写 owner）
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---- CD：v* tag 生成 GitHub Release 与三份可下载产物 ----
  release:
    name: "发布 · GitHub Release"
    runs-on: windows-latest
    needs: [test, aot]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 发布 API / 单文件 / 自包含桌面程序
        shell: bash
        run: |
          dotnet publish SimdCodecs.Api/SimdCodecs.Api.csproj -c Release -o dist/api
          dotnet publish SimdCodecsViewer/SimdCodecsViewer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/single
          dotnet publish SimdCodecsViewer/SimdCodecsViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/portable

      - name: 发布产物自检（含合规声明与模型体积预算）
        shell: bash
        run: |
          dotnet dist/api/SimdCodecs.Api.dll --apitest
          ./dist/single/SimdCodecsViewer.exe --selftest
          test -f dist/api/THIRD-PARTY-NOTICES.txt
          test -f dist/api/LICENSES/Apache-2.0.txt
          test -f dist/api/LICENSE
          test -f dist/single/THIRD-PARTY-NOTICES.txt
          test -f dist/portable/THIRD-PARTY-NOTICES.txt
          test -f dist/portable/LICENSES/Apache-2.0.txt
          # 模型是嵌入资源；单文件 exe 明显小于 30 MB 说明模型包没被带进产物
          test "$(du -m dist/single/SimdCodecsViewer.exe | cut -f1)" -gt 30

      - name: 打包分发 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/single/* -DestinationPath CodecLoom-win-x64-single.zip
          Compress-Archive -Path dist/portable/* -DestinationPath CodecLoom-win-x64-portable.zip
          Compress-Archive -Path dist/api/* -DestinationPath CodecLoom-api.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CodecLoom-win-x64-single.zip
            CodecLoom-win-x64-portable.zip
            CodecLoom-api.zip
          generate_release_notes: true
